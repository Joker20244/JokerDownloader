name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Create files
        run: |
          mkdir -p app/src/main/java/com/jokerich/downloader
          cat > settings.gradle << 'EOF'
          pluginManagement {
          repositories {
          google()
          mavenCentral()
          gradlePluginPortal()
          }
          }
          dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
          google()
          mavenCentral()
          }
          }
          rootProject.name = "JokerDownloader"
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins {
          id 'com.android.application' version '8.2.0' apply false
          id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
          cat > app/build.gradle << 'EOF'
          plugins {
          id 'com.android.application'
          id 'org.jetbrains.kotlin.android'
          }
          android {
          namespace 'com.jokerich.downloader'
          compileSdk 34
          defaultConfig {
          applicationId "com.jokerich.downloader"
          minSdk 24
          targetSdk 34
          versionCode 1
          versionName "1.0"
          }
          compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = '17' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application android:label="JokerDownloader" android:theme="@android:style/Theme.Material.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true">
          <intent-filter>
          <action android:name="android.intent.action.MAIN" />
          <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
          </activity>
          </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/jokerich/downloader/MainActivity.kt << 'EOF'
          package com.jokerich.downloader
          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView
          class MainActivity : Activity() {
          override fun onCreate(savedInstanceState: Bundle?) {
          super.onCreate(savedInstanceState)
          val tv = TextView(this)
          tv.text = "JokerDownloader works!"
          setContentView(tv)
          }
          }
          EOF
      - name: Build
        run: |
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JokerDownloader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
